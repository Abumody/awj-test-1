<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Writing Section</title>
<link rel="stylesheet" href="writing.css">
</head>

<body>

<header class="top-bar">
  <div class="brand">AWJ</div>

  <div class="student-area">
    <span id="studentName">Student</span>
    <button onclick="goHome()">Home</button>
  </div>
</header>

<main class="container">

  <h1>Writing Section 1</h1>
  <p class="subtitle">
    Write at least <strong>85 words</strong>.<br>
    Each task allows <strong>2 attempts only</strong>.
  </p>

  <div id="testsGrid" class="tests-grid"></div>

</main>

<script>

function goHome() {
  window.location.href = "../home.html";
}

/* ===============================
   STUDENT CHECK
================================ */
const student = localStorage.getItem("currentStudent");

if (!student) {
  window.location.href = "../index.html";
}

/* ===============================
   SHOW NAME
================================ */
document.getElementById("studentName").textContent = student;

/* ===============================
   CONFIG
================================ */
const TOTAL_TESTS = 6;
const MAX_ATTEMPTS = 2;
const grid = document.getElementById("testsGrid");

const topics = [
"A Problem that you had with a friend.",
"A story you read before.",
"Social media friends are not real friends.",
"Social media is very important for people today.",
"Exploring Oman is not important for teenagers.",
"Women should not be allowed to play sport."
];

/* ===============================
   GENERATE CARDS
================================ */
for (let i = 1; i <= TOTAL_TESTS; i++) {

  const TEST_ID = `writing1_test${i}`;
  const ATTEMPT_KEY = `${student}_${TEST_ID}_attempts`;

  const used = Number(localStorage.getItem(ATTEMPT_KEY)) || 0;
  const left = MAX_ATTEMPTS - used;

  const card = document.createElement("div");
  card.className = "test-card";

  const title = document.createElement("h3");
  title.textContent = `Writing ${i}`;

  const topic = document.createElement("p");
  topic.textContent = topics[i-1];

  const attempts = document.createElement("p");
  attempts.className = "attempts";

  const button = document.createElement("button");

  if (left <= 0) {
    attempts.textContent = "Locked – No attempts left";
    button.textContent = "Locked";
    button.disabled = true;
  } else {
    attempts.textContent = `Attempts left: ${left}`;
    button.textContent = "Start";
    button.onclick = () => {
      window.location.href = `writing1_test${i}.html`;
    };
  }

  card.appendChild(title);
  card.appendChild(topic);
  card.appendChild(attempts);
  card.appendChild(button);

  grid.appendChild(card);
}

</script>

</body>
</html>
