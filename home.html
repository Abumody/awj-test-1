<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWJ · Planetary Nexus</title>
  <link rel="stylesheet" href="css/home-light.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- COSMIC BACKGROUND -->
  <div class="cosmic-bg" id="cosmicBg"></div>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="brand">
      <div class="logo-icon">✦</div>
      <span class="glow">AWJ</span>
    </div>
    <div class="student-area">
      <span class="student-greeting">
        ◆ <span class="highlight" id="studentName">Student</span>
      </span>
      <button class="logout-btn" onclick="logout()">⌘ EXIT</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- HERO -->
    <div class="hero">
      <div class="glitch-text">PLANETARY NEXUS</div>
      <div class="subtitle">
        <span class="dimension">✦</span> 17 worlds · 17 dimensions of mastery 
        <span class="dimension">✦</span>
      </div>
      <div class="dimension-badge">⚡ complete all planets · unlock your potential</div>
    </div>

    <!-- PROGRESS -->
    <div class="exam-progress">
      <span class="progress-text">PROGRESS: <span class="highlight" id="progressCount">0</span>/17</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

    <!-- PLANET GRID -->
    <section>
      <div class="section-title">
        <span class="dimension-icon">◈</span>
        Explore the Universe
        <span class="neon-line"></span>
      </div>
      <div class="planet-grid" id="planetGrid">
        <!-- Planets will be generated by JavaScript -->
      </div>
    </section>

    <!-- RESULTS -->
    <div class="results-area">
      <button class="results-btn" data-link="results.html">
        <span class="portal-icon">◈</span> view results
      </button>
    </div>

  </main>

  <script src="js/home.js"></script>
</body>
</html>
