<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vocabulary 06 · Saturn Exam</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,Segoe UI,sans-serif;color:#fff;min-height:100vh;padding:20px 28px 50px;background:#100b06}
.cosmic-bg{position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse at 20% 30%,#24160b,transparent 60%),radial-gradient(ellipse at 80% 70%,#1c1208,transparent 50%),radial-gradient(ellipse at 50% 50%,#100b06,#070402 100%)}
.container{max-width:950px;margin:auto}
.top-bar,.instructions-box,.question-card,.score-display{background:rgba(16,11,6,.48);backdrop-filter:blur(30px);border:1px solid rgba(192,138,75,.1);box-shadow:0 8px 40px rgba(0,0,0,.28)}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;border-radius:60px;margin-bottom:30px}
.brand{font:900 24px Orbitron,monospace;display:flex;align-items:center;gap:12px;letter-spacing:2px}
.logo-icon{width:40px;height:40px;border:2px solid rgba(192,138,75,.2);border-radius:10px;display:grid;place-items:center;color:#C08A4B}
.glow{background:linear-gradient(135deg,#C08A4B,#E0B878);-webkit-background-clip:text;color:transparent}
button{border-radius:40px;padding:10px 22px;font:700 .75rem Orbitron,monospace;letter-spacing:1px;cursor:pointer;border:1px solid rgba(192,138,75,.1);background:rgba(255,255,255,.02);color:rgba(255,255,255,.6)}
button:hover:not(:disabled){transform:scale(1.03)}
.exam-header{text-align:center;padding:24px 0 20px}
.exam-badge{display:inline-block;font:700 .8rem Orbitron,monospace;letter-spacing:3px;color:rgba(255,255,255,.28);padding:8px 28px;border:1px solid rgba(192,138,75,.1);border-radius:40px;margin-bottom:10px}
h1{font:900 3.2rem Orbitron,monospace;letter-spacing:4px;background:linear-gradient(135deg,#fff,rgba(255,255,255,.5));-webkit-background-clip:text;color:transparent}
.subtitle{color:rgba(255,255,255,.22);font-size:1.1rem;letter-spacing:2px;margin-top:4px}
.instructions-box{border-radius:16px;padding:22px 28px;margin:10px 0 24px}
.instructions-title,.q-number,.score-label{font:700 .8rem Orbitron,monospace;letter-spacing:2px;color:rgba(255,255,255,.22)}
.instructions-text{font-size:1.2rem;font-weight:600;color:rgba(255,255,255,.62);line-height:1.8;margin-top:8px}
.highlight{color:#C08A4B}
.questions-container{display:flex;flex-direction:column;gap:24px;margin:16px 0 32px}
.question-card{border-radius:20px;padding:28px 32px}
.q-text{font-size:1.2rem;font-weight:700;color:rgba(255,255,255,.82);line-height:1.6;margin:8px 0 16px}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:14px;padding:14px 20px;background:rgba(255,255,255,.02);border-radius:12px;border:1px solid rgba(255,255,255,.05);cursor:pointer}
.option:hover:not(.disabled){background:rgba(255,255,255,.04)}
input{appearance:none;width:22px;height:22px;border:2px solid rgba(255,255,255,.12);border-radius:50%;position:relative;flex-shrink:0}
input:checked{border-color:#C08A4B;background:rgba(192,138,75,.1)}
input:checked:after{content:"";position:absolute;width:10px;height:10px;border-radius:50%;background:#C08A4B;top:50%;left:50%;transform:translate(-50%,-50%)}
.option-label{font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.52)}
input:checked~.option-label{color:#fff}
.correct{background:rgba(74,222,128,.08)!important;border-color:rgba(74,222,128,.2)!important}
.correct .option-label{color:#4ade80!important;font-weight:800}
.wrong{background:rgba(255,50,50,.08)!important;border-color:rgba(255,50,50,.2)!important}
.wrong .option-label{color:#ff6b6b!important;font-weight:800}
.disabled{opacity:.6;cursor:default}
.bottom-actions{display:flex;justify-content:center;gap:20px;margin:20px 0 30px;flex-wrap:wrap}
.bottom-actions button{padding:14px 36px;font-size:.9rem}
.btn-reset{color:#ffcc44}
.btn-submit{color:#C08A4B;background:linear-gradient(135deg,rgba(192,138,75,.08),rgba(224,184,120,.08))}
.btn-submit:disabled{opacity:.3;cursor:not-allowed}
.score-display{border-radius:20px;padding:24px 32px;display:flex;justify-content:space-between;align-items:center}
.score-value{font:900 2.2rem Orbitron,monospace;color:#C08A4B}
.denominator{font-size:1.2rem;color:rgba(255,255,255,.15);font-weight:400}
.score-detail{display:flex;gap:30px}
.correct-count{color:#4ade80;font:700 1rem Orbitron,monospace}
.wrong-count{color:#ff6b6b;font:700 1rem Orbitron,monospace}
@media(max-width:768px){body{padding:14px}.top-bar{flex-direction:column;gap:12px;padding:14px 20px}h1{font-size:2rem}.question-card{padding:20px 18px}.q-text{font-size:1rem}.score-display{flex-direction:column;gap:12px;text-align:center}.bottom-actions{flex-direction:column;align-items:center}.bottom-actions button{width:100%;max-width:300px}}
@media(max-width:480px){h1{font-size:1.6rem}.option{padding:10px 14px}.option-label{font-size:.85rem}}
</style>
</head>
<body>
<div class="cosmic-bg"></div>
<div class="container">
<header class="top-bar">
<div class="brand"><div class="logo-icon">♄</div><span class="glow">AWJ</span></div>
<div><button onclick="goBack()">◀ BACK</button></div>
</header>
<div class="exam-header">
<div class="exam-badge">✦ VOCABULARY 06 · SATURN</div>
<h1>VOCABULARY</h1>
<div class="subtitle">♄ G.12 Sem I 2nd Session 2021-2022</div>
</div>
<div class="instructions-box">
<div class="instructions-title">📋 INSTRUCTIONS</div>
<div class="instructions-text">For each item, shade in the <span class="highlight">bubble</span> next to the correct option.<br><small>⏱️ 5 questions · 5 marks</small></div>
</div>
<div class="questions-container" id="questions"></div>
<div class="bottom-actions">
<button onclick="goBack()">◀ BACK TO DASHBOARD</button>
<button class="btn-reset" onclick="resetExam()">⟳ RESET ALL</button>
<button class="btn-submit" id="submit" onclick="submitExam()" disabled>✓ SUBMIT EXAM</button>
</div>
<div class="score-display">
<span class="score-label">✦ SCORE</span>
<div class="score-detail"><span class="correct-count" id="correct">✓ 0</span><span class="wrong-count" id="wrong">✗ 0</span></div>
<span class="score-value" id="score">0<span class="denominator"> / 5</span></span>
</div>
</div>
<script>
const TEST_ID="exam6",SECTION="vocabulary";
const questions=[
{q:"She has a ________ job. After work, she is always tired and frustrated.",o:["stressful","peaceful","hopeful","beautiful"],a:0},
{q:"Dhofar ________ a lot of visitors during the Khareef season.",o:["attracts","distracts","reduces","imports"],a:0},
{q:"I chose this course because I was ________ by my brother who is a successful pilot.",o:["mislead","trekked","influenced","drafted"],a:2},
{q:"The visitors hired a guide and a ________ bus to experience Paris at night.",o:["cruise","tour","flight","voyage"],a:1},
{q:"To be happy and successful in your life, you need to have a ________ attitude.",o:["massive","negative","narrative","positive"],a:3}
];
let answers={},submitted=false;
function render(){
const c=document.getElementById("questions");
c.innerHTML=questions.map((x,i)=>
'<div class="question-card"><div class="q-number">'+String.fromCharCode(65+i)+'. Question '+(i+1)+' of 5</div>'+
'<div class="q-text">'+x.q+'</div><div class="options">'+
x.o.map((v,j)=>
'<label class="option" id="o-'+i+'-'+j+'"><input type="radio" name="q'+i+'" onchange="choose('+i+','+j+')">'+
'<span class="option-label">'+String.fromCharCode(65+j)+'. '+v+'</span></label>'
).join('')+'</div></div>').join('')
}
function choose(i,j){
if(!submitted){answers[i]=j;let n=Object.keys(answers).length;document.getElementById("submit").disabled=n<5;document.getElementById("submit").textContent=n<5?'✓ SUBMIT ('+n+'/5)':'✓ SUBMIT EXAM'}
}
function submitExam(){
if(Object.keys(answers).length<5)return;
submitted=true;let n=0;
questions.forEach((x,i)=>{let ok=answers[i]===x.a;if(ok)n++;document.getElementById('o-'+i+'-'+x.a).classList.add("correct");if(!ok)document.getElementById('o-'+i+'-'+answers[i]).classList.add("wrong");document.querySelectorAll('input[name=q'+i+']').forEach(r=>r.disabled=true)});
document.getElementById("score").innerHTML=n+'<span class="denominator"> / 5</span>';document.getElementById("correct").textContent='✓ '+n;document.getElementById("wrong").textContent='✗ '+(5-n);document.getElementById("score").style.color='#4ade80';
try{const s=localStorage.getItem("currentStudent");if(s){const all=JSON.parse(localStorage.getItem("students")||"{}");if(!all[s])all[s]={createdAt:new Date().toISOString(),tests:{}};if(!all[s].tests)all[s].tests={};if(!all[s].tests.exam6)all[s].tests.exam6={};all[s].tests.exam6.vocabulary=n;localStorage.setItem("students",JSON.stringify(all))}}catch(e){}
}
function resetExam(){if(submitted&&!confirm("This will reset all your answers. Are you sure?"))return;submitted=false;answers={};render();document.getElementById("submit").disabled=true;document.getElementById("submit").textContent="✓ SUBMIT (0/5)";document.getElementById("score").innerHTML='0<span class="denominator"> / 5</span>';document.getElementById("score").style.color="#C08A4B";document.getElementById("correct").textContent="✓ 0";document.getElementById("wrong").textContent="✗ 0"}
function goBack(){window.location.href="saturn_Dashboard.html"}
render();
</script>
</body>
</html>
