<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grammar 05 · Jupiter Exam</title>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #ffffff;
      min-height: 100vh;
      padding: 20px 28px 50px;
      background: #16070D;
      position: relative;
      transition: all 0.4s ease;
    }

    body.light-theme {
      background: #f0f2f5;
      color: #1a1a2e;
    }

    body.light-theme .cosmic-bg {
      background: 
        radial-gradient(ellipse at 20% 30%, #e8ecf1, transparent 60%),
        radial-gradient(ellipse at 80% 70%, #d5dce6, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #f0f2f5, #e4e8ed 100%);
    }

    body.light-theme .nebula-1,
    body.light-theme .nebula-2 {
      display: none;
    }

    body.light-theme .top-bar {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(30px);
      border-color: rgba(0, 0, 0, 0.06);
    }

    body.light-theme .brand .glow {
      background: linear-gradient(135deg, #4a7cf7, #7c5cbf);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    body.light-theme .brand .logo-icon {
      border-color: rgba(74, 124, 247, 0.2);
      color: #4a7cf7;
    }

    body.light-theme .exam-badge {
      color: rgba(0, 0, 0, 0.3);
      border-color: rgba(0, 0, 0, 0.06);
    }

    body.light-theme .exam-header h1 {
      background: linear-gradient(135deg, #1a1a2e, rgba(26, 26, 46, 0.5));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    body.light-theme .exam-header .subtitle {
      color: rgba(0, 0, 0, 0.25);
    }

    body.light-theme .question-card {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(30px);
      border-color: rgba(0, 0, 0, 0.06);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.04);
    }

    body.light-theme .question-card .q-number {
      color: rgba(0, 0, 0, 0.15);
    }

    body.light-theme .question-card .q-text {
      color: rgba(0, 0, 0, 0.7);
    }

    body.light-theme .option {
      background: rgba(0, 0, 0, 0.02);
      border-color: rgba(0, 0, 0, 0.04);
    }

    body.light-theme .option:hover:not(.disabled) {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.08);
    }

    body.light-theme .option input[type="radio"] {
      border-color: rgba(0, 0, 0, 0.15);
    }

    body.light-theme .option input[type="radio"]:checked:not(:disabled) {
      border-color: #4a7cf7;
      background: rgba(74, 124, 247, 0.08);
    }

    body.light-theme .option input[type="radio"]:checked:not(:disabled)::after {
      background: #4a7cf7;
    }

    body.light-theme .option .option-label {
      color: rgba(0, 0, 0, 0.5);
    }

    body.light-theme .option input[type="radio"]:checked:not(:disabled) ~ .option-label {
      color: #1a1a2e;
    }

    body.light-theme .option.correct {
      background: rgba(74, 222, 128, 0.12);
      border-color: rgba(74, 222, 128, 0.25);
    }

    body.light-theme .option.wrong {
      background: rgba(255, 50, 50, 0.12);
      border-color: rgba(255, 50, 50, 0.25);
    }

    body.light-theme .btn-back {
      background: rgba(0, 0, 0, 0.02);
      color: rgba(0, 0, 0, 0.6);
    }

    body.light-theme .btn-back:hover {
      background: rgba(74, 124, 247, 0.05);
      border-color: rgba(74, 124, 247, 0.1);
    }

    body.light-theme .btn-reset {
      background: rgba(255, 200, 50, 0.04);
      color: #b8860b;
      border-color: rgba(255, 200, 50, 0.08);
    }

    body.light-theme .btn-reset:hover {
      background: rgba(255, 200, 50, 0.08);
      border-color: rgba(255, 200, 50, 0.15);
    }

    body.light-theme .btn-submit {
      background: linear-gradient(135deg, rgba(74, 124, 247, 0.08), rgba(124, 92, 191, 0.08));
      color: #4a7cf7;
      border-color: rgba(74, 124, 247, 0.1);
    }

    body.light-theme .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(74, 124, 247, 0.15), rgba(124, 92, 191, 0.15));
      border-color: rgba(74, 124, 247, 0.2);
    }

    body.light-theme .score-display {
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(30px);
      border-color: rgba(0, 0, 0, 0.06);
    }

    body.light-theme .score-display .score-label {
      color: rgba(0, 0, 0, 0.15);
    }

    body.light-theme .score-display .score-value {
      color: #4a7cf7;
    }

    body.light-theme .score-display .score-value .denominator {
      color: rgba(0, 0, 0, 0.15);
    }

    body.light-theme .instructions-box {
      background: rgba(255, 255, 255, 0.7);
      border-color: rgba(0, 0, 0, 0.06);
    }

    body.light-theme .instructions-box .instructions-title {
      color: rgba(0, 0, 0, 0.4);
    }

    body.light-theme .instructions-box .instructions-text {
      color: rgba(0, 0, 0, 0.6);
    }

    body.light-theme .btn-theme {
      background: rgba(0, 0, 0, 0.02);
      color: rgba(0, 0, 0, 0.5);
      border-color: rgba(0, 0, 0, 0.06);
    }

    body.light-theme .btn-theme:hover {
      background: rgba(0, 0, 0, 0.04);
      border-color: rgba(0, 0, 0, 0.1);
    }

    body.light-theme .star {
      display: none;
    }

    .cosmic-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      background: 
        radial-gradient(ellipse at 20% 30%, #5A1020, transparent 60%),
        radial-gradient(ellipse at 80% 70%, #310A17, transparent 50%),
        radial-gradient(ellipse at 50% 50%, #16070D, #050204 100%);
      overflow: hidden;
      transition: all 0.4s ease;
    }

    .nebula {
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      animation: nebulaFloat 30s ease-in-out infinite alternate;
    }

    .nebula-1 {
      width: 600px;
      height: 600px;
      background: rgba(100, 50, 200, 0.06);
      top: -200px;
      right: -100px;
      animation-duration: 35s;
    }

    .nebula-2 {
      width: 500px;
      height: 500px;
      background: rgba(50, 100, 200, 0.05);
      bottom: -150px;
      left: -100px;
      animation-duration: 40s;
      animation-delay: 5s;
    }

    @keyframes nebulaFloat {
      0% { transform: translate(0, 0) scale(1); }
      33% { transform: translate(60px, -40px) scale(1.1); }
      66% { transform: translate(-40px, 60px) scale(0.9); }
      100% { transform: translate(40px, -30px) scale(1.05); }
    }

    .star {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      background: #ffffff;
      animation: twinkle var(--duration) ease-in-out infinite alternate;
    }

    @keyframes twinkle {
      0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
      50% { opacity: var(--max-opacity); transform: scale(1.3); }
    }

    .container {
      max-width: 950px;
      margin: 0 auto;
      position: relative;
      z-index: 5;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 32px;
      background: rgba(5, 5, 20, 0.6);
      backdrop-filter: blur(30px);
      border-radius: 60px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5);
      margin-bottom: 30px;
      transition: all 0.4s ease;
    }

    .brand {
      font-family: 'Orbitron', monospace;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 2px;
      display: flex;
      align-items: center;
      gap: 12px;
      color: #ffffff;
      transition: all 0.4s ease;
    }

    .brand .logo-icon {
      width: 40px;
      height: 40px;
      border: 2px solid rgba(100, 200, 255, 0.15);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      background: rgba(100, 200, 255, 0.03);
      color: #64c8ff;
      transition: all 0.4s ease;
    }

    .brand .glow {
      background: linear-gradient(135deg, #64c8ff, #a78bfa);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: all 0.4s ease;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-back, .btn-reset, .btn-submit, .btn-theme {
      padding: 10px 22px;
      border-radius: 40px;
      font-family: 'Orbitron', monospace;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .btn-theme {
      background: rgba(255, 255, 255, 0.02);
      color: rgba(255, 255, 255, 0.5);
      font-size: 1.2rem;
      padding: 8px 14px;
    }

    .btn-theme:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.1);
      transform: scale(1.04);
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.02);
      color: rgba(255, 255, 255, 0.6);
    }

    .btn-back:hover {
      background: rgba(100, 200, 255, 0.05);
      border-color: rgba(100, 200, 255, 0.1);
      transform: scale(1.04);
    }

    .btn-reset {
      background: rgba(255, 200, 50, 0.03);
      color: #ffcc44;
      border-color: rgba(255, 200, 50, 0.08);
    }

    .btn-reset:hover {
      background: rgba(255, 200, 50, 0.06);
      border-color: rgba(255, 200, 50, 0.15);
      transform: scale(1.04);
    }

    .btn-submit {
      background: linear-gradient(135deg, rgba(100, 200, 255, 0.08), rgba(167, 139, 250, 0.08));
      color: #a78bfa;
      border-color: rgba(167, 139, 250, 0.1);
    }

    .btn-submit:hover:not(:disabled) {
      background: linear-gradient(135deg, rgba(100, 200, 255, 0.15), rgba(167, 139, 250, 0.15));
      border-color: rgba(167, 139, 250, 0.2);
      transform: scale(1.04);
    }

    .btn-submit:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none !important;
    }

    .exam-header {
      text-align: center;
      padding: 24px 0 20px;
    }

    .exam-badge {
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.25);
      padding: 8px 28px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      border-radius: 40px;
      display: inline-block;
      margin-bottom: 10px;
      transition: all 0.4s ease;
    }

    .exam-header h1 {
      font-family: 'Orbitron', monospace;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #ffffff, rgba(255, 255, 255, 0.5));
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      transition: all 0.4s ease;
    }

    .exam-header .subtitle {
      color: rgba(255, 255, 255, 0.2);
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-weight: 300;
      margin-top: 4px;
      transition: all 0.4s ease;
    }

    .instructions-box {
      background: rgba(5, 5, 20, 0.3);
      backdrop-filter: blur(20px);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 22px 28px;
      margin: 10px 0 24px;
      transition: all 0.4s ease;
    }

    .instructions-box .instructions-title {
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
      margin-bottom: 8px;
    }

    .instructions-box .instructions-text {
      font-size: 1.2rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      line-height: 1.8;
    }

    .instructions-box .instructions-text .highlight {
      color: #64c8ff;
      font-weight: 800;
    }

    body.light-theme .instructions-box .instructions-text .highlight {
      color: #4a7cf7;
    }


    /* Full-conversation layout — same structure as Earth Grammar 03 */
    .conversation-card {
      padding: 30px 34px;
    }
    .conversation-text {
      text-align: left;
      line-height: 1.75;
    }
    .conversation-text p {
      margin: 0 0 18px;
    }
    .conversation-text p + .options {
      margin-top: -4px;
      margin-bottom: 24px;
    }
    .conversation-text strong {
      color: #ff765f;
      font-style: italic;
    }
    .blank-marker {
      font-weight: 800;
      color: #ff8a65;
      white-space: nowrap;
    }

    .questions-container {
      display: flex;
      flex-direction: column;
      gap: 24px;
      margin: 16px 0 32px;
    }

    .question-card {
      background: rgba(5, 5, 20, 0.3);
      backdrop-filter: blur(30px);
      border-radius: 20px;
      padding: 28px 32px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.2);
      transition: all 0.4s ease;
    }

    .question-card:hover {
      border-color: rgba(255, 255, 255, 0.06);
    }

    .question-card .q-number {
      font-family: 'Orbitron', monospace;
      font-size: 0.8rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 2px;
      margin-bottom: 8px;
      transition: all 0.4s ease;
    }

    .question-card .q-text {
      font-size: 1.2rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.8);
      margin-bottom: 16px;
      line-height: 1.6;
      transition: all 0.4s ease;
    }

    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .option:hover:not(.disabled) {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .option input[type="radio"] {
      appearance: none;
      width: 22px;
      height: 22px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }

    .option input[type="radio"]:checked:not(:disabled) {
      border-color: #a78bfa;
      background: rgba(167, 139, 250, 0.1);
    }

    .option input[type="radio"]:checked:not(:disabled)::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #a78bfa;
    }

    .option input[type="radio"]:disabled {
      cursor: not-allowed;
    }

    .option .option-label {
      font-size: 1.1rem;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      transition: color 0.3s ease;
    }

    .option input[type="radio"]:checked:not(:disabled) ~ .option-label {
      color: #ffffff;
    }

    .option.correct {
      background: rgba(74, 222, 128, 0.08);
      border-color: rgba(74, 222, 128, 0.2);
    }

    .option.correct .option-label {
      color: #4ade80 !important;
      font-weight: 800;
    }

    .option.correct input[type="radio"] {
      border-color: #4ade80 !important;
      background: rgba(74, 222, 128, 0.1) !important;
    }

    .option.correct input[type="radio"]::after {
      background: #4ade80 !important;
    }

    .option.wrong {
      background: rgba(255, 50, 50, 0.08);
      border-color: rgba(255, 50, 50, 0.2);
    }

    .option.wrong .option-label {
      color: #ff6b6b !important;
      font-weight: 800;
    }

    .option.wrong input[type="radio"] {
      border-color: #ff6b6b !important;
      background: rgba(255, 50, 50, 0.1) !important;
    }

    .option.wrong input[type="radio"]::after {
      background: #ff6b6b !important;
    }

    .option.disabled {
      opacity: 0.6;
      cursor: default;
    }

    .option.disabled:hover {
      background: rgba(255, 255, 255, 0.02);
      border-color: rgba(255, 255, 255, 0.04);
    }

    .bottom-actions {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin: 20px 0 30px;
      flex-wrap: wrap;
    }

    .bottom-actions .btn-back,
    .bottom-actions .btn-reset,
    .bottom-actions .btn-submit {
      padding: 14px 36px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .score-display {
      background: rgba(5, 5, 20, 0.4);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 24px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      transition: all 0.4s ease;
    }

    .score-display .score-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.9rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.15);
      letter-spacing: 2px;
      transition: all 0.4s ease;
    }

    .score-display .score-value {
      font-family: 'Orbitron', monospace;
      font-size: 2.2rem;
      font-weight: 900;
      color: #a78bfa;
      transition: color 0.5s ease;
    }

    .score-display .score-value .denominator {
      font-size: 1.2rem;
      color: rgba(255, 255, 255, 0.15);
      font-weight: 400;
    }

    .score-display .score-detail {
      display: flex;
      align-items: center;
      gap: 30px;
    }

    .score-display .score-detail .correct-count {
      color: #4ade80;
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 700;
    }

    .score-display .score-detail .wrong-count {
      color: #ff6b6b;
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 700;
    }

    @media (max-width: 768px) {
      body { padding: 14px; }
      .top-bar { flex-direction: column; gap: 12px; padding: 14px 20px; border-radius: 40px; }
      .top-actions { flex-wrap: wrap; justify-content: center; }
      .exam-header h1 { font-size: 2rem; }
      .question-card { padding: 20px 18px; }
      .question-card .q-text { font-size: 1rem; }
      .score-display { flex-direction: column; gap: 12px; text-align: center; }
      .score-display .score-detail { justify-content: center; gap: 20px; }
      .bottom-actions { flex-direction: column; align-items: center; }
      .bottom-actions .btn-back,
      .bottom-actions .btn-reset,
      .bottom-actions .btn-submit { width: 100%; max-width: 300px; }
      .instructions-box .instructions-text { font-size: 1rem; }
      .option .option-label { font-size: 0.95rem; }
    }

    @media (max-width: 480px) {
      .exam-header h1 { font-size: 1.6rem; letter-spacing: 2px; }
      .option { padding: 10px 14px; }
      .option .option-label { font-size: 0.85rem; }
      .instructions-box .instructions-text { font-size: 0.9rem; }
      .score-display .score-value { font-size: 1.8rem; }
    }

    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
    ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #64c8ff, #a78bfa); border-radius: 12px; }

    body.light-theme ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.05); }
    body.light-theme ::-webkit-scrollbar-thumb { background: linear-gradient(135deg, #4a7cf7, #7c5cbf); }
  



/* ===== JUPITER IDENTITY — BACKGROUND ONLY ===== */
body {
  background: #0B1020;
}
.cosmic-bg {
  background:
    radial-gradient(ellipse at 18% 25%, #343B52 0%, transparent 58%),
    radial-gradient(ellipse at 82% 72%, #4A4658 0%, transparent 56%),
    radial-gradient(ellipse at 50% 50%, #03050B 0%, #0B1020 100%);
}

</style>
</head>
<body>
  <div class="cosmic-bg">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div id="starContainer"></div>
  </div>

  <div class="container">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <div class="logo-icon">⚡</div>
        <span class="glow">AWJ</span>
      </div>
      <div class="top-actions">
        <button class="btn-theme" onclick="toggleTheme()" title="Toggle theme">🌓</button>
        <button class="btn-back" onclick="goBack()">◀ BACK</button>
      </div>
    </header>

    <!-- Exam Header -->
    <div class="exam-header">
      <div class="exam-badge">✦ GRAMMAR 05 · JUPITER</div>
      <h1>GRAMMAR FOCUS</h1>
      <div class="subtitle">♂ G.12 Sem I 2nd Session 2022-2023</div>
    </div>

    <!-- Instructions -->
    <div class="instructions-box">
      <div class="instructions-title">📋 INSTRUCTIONS</div>
      <div class="instructions-text">
        For each item, shade in the bubble next to the correct option.
        <br><br>
        <span style="font-size:0.9rem; font-weight:400; opacity:0.5;">⏱️ Read the conversation carefully and select the best answer.</span>
      </div>
    </div>

    <!-- Questions -->
    <div class="questions-container" id="questionsContainer"></div>

    <!-- Bottom Actions -->
    <div class="bottom-actions">
      <button class="btn-back" onclick="goBack()">◀ BACK TO DASHBOARD</button>
      <button class="btn-reset" onclick="resetExam()">⟳ RESET ALL</button>
      <button class="btn-submit" id="submitBtn" onclick="submitExam()">✓ SUBMIT EXAM</button>
    </div>

    <!-- Score Display -->
    <div class="score-display">
      <span class="score-label">✦ SCORE</span>
      <div class="score-detail">
        <span class="correct-count" id="correctCount">✓ 0</span>
        <span class="wrong-count" id="wrongCount">✗ 0</span>
      </div>
      <span class="score-value" id="scoreValue">
        <span id="scoreNum">0</span>
        <span class="denominator"> / 5</span>
      </span>
    </div>
  </div>

  <script>
    // ============================================================
    // STARS
    // ============================================================
    function createStars() {
      const container = document.getElementById('starContainer');
      if (!container) return;
      for (let i = 0; i < 120; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        const size = Math.random() * 3 + 1;
        const x = Math.random() * 100;
        const y = Math.random() * 100;
        const duration = Math.random() * 4 + 2;
        const minOpacity = Math.random() * 0.2 + 0.1;
        const maxOpacity = Math.random() * 0.6 + 0.4;
        star.style.cssText = `
          width: ${size}px; height: ${size}px; left: ${x}%; top: ${y}%;
          --duration: ${duration}s; --min-opacity: ${minOpacity}; --max-opacity: ${maxOpacity};
          animation-delay: ${Math.random() * 4}s;
        `;
        container.appendChild(star);
      }
    }
    createStars();

    // ============================================================
    // THEME
    // ============================================================
    let isLightTheme = false;
    function toggleTheme() {
      isLightTheme = !isLightTheme;
      document.body.classList.toggle('light-theme', isLightTheme);
      localStorage.setItem('grammar05JupiterTheme', isLightTheme ? 'light' : 'dark');
    }
    const savedTheme = localStorage.getItem('grammar05JupiterTheme');
    if (savedTheme === 'light') {
      isLightTheme = true;
      document.body.classList.add('light-theme');
    }

    // ============================================================
    // ============================================================
    // GRAMMAR 04 QUESTIONS — full conversation, questions 1–5
    // ============================================================
    const questions = [
      { id: 1, options: ['finished', 'finish'], correct: 0 },
      { id: 2, options: ['searching', 'search'], correct: 0 },
      { id: 3, options: ['was', 'were'], correct: 0 },
      { id: 4, options: ['it', 'them'], correct: 0 },
      { id: 5, options: ['If', 'Unless'], correct: 0 }
    ];

    // ============================================================
    // STATE
    // ============================================================
    let userAnswers = {};
    let isSubmitted = false;

    // ============================================================
    // RENDER — ONE FULL CONVERSATION CARD
    // ============================================================
    function renderQuestions() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = '';

      const card = document.createElement('div');
      card.className = 'question-card conversation-card';
      card.id = 'q-0';

      const makeOptions = (qIndex) => questions[qIndex].options.map((opt, i) =>
        `<label class="option" id="opt-${qIndex}-${i}">
          <input type="radio" name="q${qIndex}" value="${i}" onchange="selectOption(${qIndex}, ${i})">
          <span class="option-label">${String.fromCharCode(65+i)}. ${opt}</span>
        </label>`).join('');

      card.innerHTML = `
        <div class="q-number">CONVERSATION · QUESTIONS 1–5</div>
        <div class="q-text conversation-text">

          <p><strong>Speaker A:</strong> Have you (1) ______ your homework yet?</p>
          <div class="options" id="options-0">${makeOptions(0)}</div>

          <p><strong>Speaker B:</strong> Yes, I finished it this morning.</p>

          <p><strong>Speaker A:</strong> What were you (2) ______ for online?</p>
          <div class="options" id="options-1">${makeOptions(1)}</div>

          <p><strong>Speaker B:</strong> I was looking for some information for my project.</p>

          <p><strong>Speaker A:</strong> Why (3) ______ the website so useful?</p>
          <div class="options" id="options-2">${makeOptions(2)}</div>

          <p><strong>Speaker B:</strong> Because it had everything I needed.</p>

          <p><strong>Speaker A:</strong> Did you save (4) ______ to your computer?</p>
          <div class="options" id="options-3">${makeOptions(3)}</div>

          <p><strong>Speaker B:</strong> Yes, I did.</p>

          <p><strong>Speaker A:</strong> (5) ______ you need more information, you can search again.</p>
          <div class="options" id="options-4">${makeOptions(4)}</div>

          <p><strong>Speaker B:</strong> Thanks. I will.</p>

        </div>`;

      container.appendChild(card);
    }

    // ============================================================
    // INTERACTIONS
    // ============================================================
    function selectOption(qIndex, optIndex) {
      if (isSubmitted) return;
      userAnswers[qIndex] = optIndex;
      updateSubmitButton();
    }

    function updateSubmitButton() {
      const btn = document.getElementById('submitBtn');
      const answered = Object.keys(userAnswers).length;
      btn.disabled = answered < questions.length;
      btn.textContent = answered < questions.length ? `✓ SUBMIT (${answered}/${questions.length})` : '✓ SUBMIT EXAM';
    }

    // ============================================================
    // SUBMIT
    // ============================================================
    function submitExam() {
      if (isSubmitted) return;
      const answered = Object.keys(userAnswers).length;
      if (answered < questions.length) {
        alert(`Please answer all ${questions.length} questions before submitting. (${answered}/${questions.length} answered)`);
        return;
      }

      isSubmitted = true;
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').textContent = '✓ SUBMITTED';

      let correctCount = 0;
      let wrongCount = 0;

      questions.forEach((q, index) => {
        const userAns = userAnswers[index];
        const isCorrect = userAns === q.correct;
        if (isCorrect) correctCount++;
        else wrongCount++;

        const correctOpt = document.getElementById(`opt-${index}-${q.correct}`);
        if (correctOpt) correctOpt.classList.add('correct');

        if (!isCorrect && userAns !== undefined) {
          const wrongOpt = document.getElementById(`opt-${index}-${userAns}`);
          if (wrongOpt) wrongOpt.classList.add('wrong');
        }

        const optionsContainer = document.getElementById(`options-${index}`);
        if (optionsContainer) {
          optionsContainer.querySelectorAll('.option').forEach(opt => {
            opt.classList.add('disabled');
            const radio = opt.querySelector('input[type="radio"]');
            if (radio) radio.disabled = true;
          });
        }
      });

      document.getElementById('scoreNum').textContent = correctCount;
      document.getElementById('correctCount').textContent = `✓ ${correctCount}`;
      document.getElementById('wrongCount').textContent = `✗ ${wrongCount}`;
      document.getElementById('scoreValue').style.color = '#4ade80';

      // Save score to localStorage
      try {
        const student = localStorage.getItem('currentStudent');
        if (student) {
          const students = JSON.parse(localStorage.getItem('students')) || {};
          if (!students[student]) students[student] = { createdAt: new Date().toISOString(), tests: {} };
          if (!students[student].tests) students[student].tests = {};
          if (!students[student].tests['exam5']) students[student].tests['exam5'] = {};
          students[student].tests['exam5']['grammar'] = correctCount;
          localStorage.setItem('students', JSON.stringify(students));
        }
      } catch (e) {}
    }

    // ============================================================
    // RESET
    // ============================================================
    function resetExam() {
      if (isSubmitted && !confirm('Reset all answers?')) return;
      isSubmitted = false;
      userAnswers = {};
      document.getElementById('scoreNum').textContent = '0';
      document.getElementById('correctCount').textContent = '✓ 0';
      document.getElementById('wrongCount').textContent = '✗ 0';
      document.getElementById('scoreValue').style.color = '#a78bfa';
      document.getElementById('submitBtn').disabled = true;
      document.getElementById('submitBtn').textContent = '✓ SUBMIT (0/5)';

      questions.forEach((q, index) => {
        const container = document.getElementById(`options-${index}`);
        if (container) {
          container.querySelectorAll('.option').forEach(opt => {
            opt.classList.remove('correct', 'wrong', 'disabled');
            const radio = opt.querySelector('input[type="radio"]');
            if (radio) {
              radio.checked = false;
              radio.disabled = false;
            }
          });
        }
      });
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    function goBack() {
      document.body.style.transition = 'opacity 0.3s ease';
      document.body.style.opacity = '0';
      setTimeout(() => {
        window.location.href = 'jupiter_Dashboard.html';
      }, 300);
    }

    // ============================================================
    // INIT
    // ============================================================
    renderQuestions();
    updateSubmitButton();

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !document.getElementById('submitBtn').disabled) {
        submitExam();
      }
    });
  </script>
</body>
</html>
