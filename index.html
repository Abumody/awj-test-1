<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWJ · Enter the Nexus</title>
  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Cosmic Background -->
  <div class="cosmic-bg" id="cosmicBg"></div>

  <div class="portal-page">

    <div class="portal-card">
      <!-- Dimensional Portal Ring -->
      <div class="portal-ring">
        <div class="ring-inner"></div>
        <div class="ring-outer"></div>
        <div class="logo-dimension">
          <span class="dimension-symbol">✦</span>
          <span class="brand-text">AWJ</span>
        </div>
      </div>

      <h1 class="glitch-title" data-text="INITIALIZE">INITIALIZE</h1>

      <p class="intro">
        <span class="dimension-accent">⟡</span> enter your identity to cross the threshold 
        <span class="dimension-accent">⟡</span>
      </p>

      <div class="input-container">
        <input 
          type="text" 
          id="studentName" 
          placeholder="full name"
          autocomplete="off"
        >
        <div class="input-glow"></div>
      </div>

      <button onclick="enterPlatform()">
        <span class="btn-icon">◈</span> enter the nexus
      </button>

      <p class="note">
        <span class="note-symbol">◆</span> your results are preserved across dimensions
      </p>
    </div>

  </div>

  <script src="js/storage.js"></script>
</body>
</html>
