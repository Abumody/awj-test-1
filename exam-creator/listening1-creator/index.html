<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWJ · Listening 1 Creator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- COSMIC BACKGROUND -->
  <div class="cosmic-bg">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <div id="starContainer"></div>
  </div>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="brand">
      <div class="logo-icon">✦</div>
      <span class="glow">AWJ</span>
    </div>
    <div class="student-area">
      <span class="student-greeting">
        ◆ <span class="highlight">Listening 1 Creator</span>
      </span>
      <button class="back-btn" onclick="goHome()">
        <span>◀</span> BACK
      </button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-content">
        <div class="exam-badge">✦ LISTENING 1</div>
        <h1>LISTENING CREATOR</h1>
        <div class="subtitle">create listening tests for each planet</div>
      </div>
    </div>

    <!-- PLANET SELECTION -->
    <div class="section-title">
      <span class="dimension-icon">◈</span>
      Select Planet
      <span class="neon-line"></span>
    </div>

    <div class="planet-selector" id="planetSelector">
      <!-- Planets will be generated by JavaScript -->
    </div>

    <!-- TEST FORM -->
    <div class="test-form" id="testForm" style="display: none;">
      <div class="section-title">
        <span class="dimension-icon">✦</span>
        Test Configuration
        <span class="neon-line"></span>
      </div>

      <div class="form-container">
        <!-- Instructions -->
        <div class="form-group">
          <label for="instructions">Instructions</label>
          <textarea id="instructions" rows="3" placeholder="You are going to hear a conversation between...">You are going to hear a conversation between two friends about their weekend plans. Listen carefully and select the correct answer for each question.</textarea>
        </div>

        <!-- Audio File Selection -->
        <div class="form-group">
          <label>Audio File</label>
          <div class="audio-selector">
            <div class="file-upload-wrapper">
              <input type="file" id="audioFileInput" accept=".mp3,.m4a,.wav,.ogg">
              <label for="audioFileInput" class="file-upload-btn">
                <span>🎵</span> CHOOSE AUDIO FILE
              </label>
              <span class="file-name" id="audioFileName">No file selected</span>
            </div>
            <div class="audio-preview" id="audioPreview" style="display: none;">
              <audio controls id="audioPlayer">
                <source id="audioSource" src="" type="audio/mpeg">
                Your browser does not support the audio element.
              </audio>
            </div>
          </div>
          <div class="audio-hint">
            <span>📁 Select an MP3, M4A, WAV, or OGG file</span>
          </div>
        </div>

        <!-- Questions -->
        <div class="form-group">
          <label>Questions (7)</label>
          <div id="questionsContainer">
            <!-- 7 questions will be generated by JavaScript -->
          </div>
        </div>

        <!-- Actions -->
        <div class="form-actions">
          <button class="generate-btn" onclick="generateTest()">
            <span>🚀</span> GENERATE TEST
          </button>
          <button class="preview-btn" onclick="previewTest()">
            <span>👁</span> PREVIEW
          </button>
        </div>
      </div>
    </div>

    <!-- GENERATED OUTPUT -->
    <div class="output-section" id="outputSection" style="display: none;">
      <div class="section-title">
        <span class="dimension-icon">✦</span>
        Test Generated
        <span class="neon-line"></span>
      </div>
      
      <div class="output-container">
        <div class="output-header">
          <h3 id="outputPlanetName">Listening Test</h3>
          <button class="copy-btn" onclick="copyCode()">
            <span>📋</span> COPY CODE
          </button>
        </div>
        <div class="output-code">
          <pre id="outputCode"></pre>
        </div>
        <div class="output-actions">
          <button class="download-btn" onclick="downloadCode()">
            <span>⬇</span> DOWNLOAD HTML
          </button>
          <button class="preview-btn" onclick="previewGenerated()">
            <span>👁</span> PREVIEW
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
