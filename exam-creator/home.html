<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWJ · Exam Creator</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- COSMIC BACKGROUND -->
  <div class="cosmic-bg">
    <div class="nebula nebula-1"></div>
    <div class="nebula nebula-2"></div>
    <div class="nebula nebula-3"></div>
    <div id="starContainer"></div>
  </div>

  <!-- HEADER -->
  <header class="top-bar">
    <div class="brand">
      <div class="logo-icon">✦</div>
      <span class="glow">AWJ</span>
    </div>
    <div class="student-area">
      <span class="student-greeting">
        ◆ <span class="highlight">Creator</span>
      </span>
      <button class="back-btn" onclick="goHome()">
        <span>◀</span> BACK
      </button>
      <button class="logout-btn" onclick="logout()">⌘ EXIT</button>
    </div>
  </header>

  <!-- MAIN -->
  <main class="container">

    <!-- HERO -->
    <div class="hero">
      <div class="hero-content">
        <div class="exam-badge">✦ EXAM CREATOR</div>
        <h1>PLANETARY NEXUS</h1>
        <div class="subtitle">create exam dashboards for 17 planets across the universe</div>
      </div>
    </div>

    <!-- PLANET GRID -->
    <div class="section-title">
      <span class="dimension-icon">◈</span>
      Select a Planet
      <span class="neon-line"></span>
    </div>

    <div class="planet-grid" id="planetGrid">
      <!-- Planets will be generated by JavaScript -->
    </div>

    <!-- GENERATED OUTPUT -->
    <div class="output-section" id="outputSection" style="display: none;">
      <div class="section-title">
        <span class="dimension-icon">✦</span>
        Dashboard Generated
        <span class="neon-line"></span>
      </div>
      
      <div class="output-container">
        <div class="output-header">
          <h3 id="outputPlanetName">Mercury</h3>
          <button class="copy-btn" onclick="copyCode()">
            <span>📋</span> COPY CODE
          </button>
        </div>
        <div class="output-code">
          <pre id="outputCode"></pre>
        </div>
        <div class="output-actions">
          <button class="download-btn" onclick="downloadCode()">
            <span>⬇</span> DOWNLOAD HTML
          </button>
          <button class="preview-btn" onclick="previewCode()">
            <span>👁</span> PREVIEW
          </button>
        </div>
      </div>
    </div>

  </main>

  <script src="script.js"></script>
</body>
</html>
