<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary · Venus Exam 2</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --venus:#C77F7A;
  --venus-light:#E7B0A9;
  --venus-soft:rgba(199,127,122,.12);
  --venus-border:rgba(199,127,122,.25);
  --bg:#160c0d;
  --card:rgba(35,18,20,.72);
}
body{
  font-family:'Inter','Segoe UI',sans-serif;color:#fff;min-height:100vh;
  padding:20px 28px 50px;background:var(--bg);position:relative;
}
.cosmic-bg{
  position:fixed;inset:0;z-index:0;overflow:hidden;
  background:
    radial-gradient(ellipse at 20% 30%,#3a181a,transparent 58%),
    radial-gradient(ellipse at 80% 70%,#281116,transparent 52%),
    radial-gradient(ellipse at 50% 50%,#160c0d,#090506 100%);
}
.nebula{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none;animation:float 30s ease-in-out infinite alternate}
.nebula-1{width:600px;height:600px;background:rgba(199,127,122,.12);top:-220px;right:-100px}
.nebula-2{width:500px;height:500px;background:rgba(231,176,169,.07);bottom:-180px;left:-100px;animation-duration:40s}
@keyframes float{0%{transform:translate(0,0) scale(1)}50%{transform:translate(45px,-35px) scale(1.08)}100%{transform:translate(-30px,40px) scale(.95)}}
.star{position:absolute;border-radius:50%;background:#fff;pointer-events:none;animation:twinkle var(--duration) ease-in-out infinite alternate}
@keyframes twinkle{0%,100%{opacity:var(--min)}50%{opacity:var(--max);transform:scale(1.3)}}
.container{max-width:950px;margin:0 auto;position:relative;z-index:5}
.top-bar{
 display:flex;justify-content:space-between;align-items:center;padding:14px 32px;
 background:rgba(24,11,13,.72);backdrop-filter:blur(30px);border-radius:60px;
 border:1px solid rgba(231,176,169,.12);box-shadow:0 8px 40px rgba(0,0,0,.45);margin-bottom:30px
}
.brand{font-family:Orbitron,monospace;font-size:24px;font-weight:900;letter-spacing:2px;display:flex;align-items:center;gap:12px}
.logo-icon{
 width:40px;height:40px;border:2px solid var(--venus-border);border-radius:10px;
 display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--venus-light);
 background:var(--venus-soft)
}
.brand .glow{background:linear-gradient(135deg,var(--venus-light),#f0c9c2);-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:12px}
button{font-family:Orbitron,monospace;cursor:pointer;transition:.3s;border:1px solid rgba(255,255,255,.08)}
.btn-back,.btn-reset,.btn-submit,.btn-theme{padding:10px 22px;border-radius:40px;font-size:.75rem;font-weight:700;letter-spacing:1px}
.btn-theme{background:rgba(255,255,255,.03);color:rgba(255,255,255,.65);font-size:1.2rem;padding:8px 14px}
.btn-theme:hover,.btn-back:hover,.btn-reset:hover,.btn-submit:hover:not(:disabled){transform:scale(1.04)}
.btn-back{background:rgba(255,255,255,.03);color:rgba(255,255,255,.68)}
.btn-back:hover{background:var(--venus-soft);border-color:var(--venus-border)}
.btn-reset{background:rgba(255,200,50,.04);color:#ffd166;border-color:rgba(255,209,102,.12)}
.btn-submit{background:linear-gradient(135deg,rgba(199,127,122,.14),rgba(231,176,169,.08));color:var(--venus-light);border-color:var(--venus-border)}
.btn-submit:disabled{opacity:.35;cursor:not-allowed}
.exam-header{text-align:center;padding:24px 0 20px}
.exam-badge{
 font-family:Orbitron,monospace;font-size:.8rem;font-weight:700;letter-spacing:3px;
 color:rgba(255,255,255,.38);padding:8px 28px;border:1px solid rgba(231,176,169,.14);
 border-radius:40px;display:inline-block;margin-bottom:10px
}
.exam-header h1{
 font-family:Orbitron,monospace;font-size:3.2rem;font-weight:900;letter-spacing:4px;
 background:linear-gradient(135deg,#fff,var(--venus-light));-webkit-background-clip:text;background-clip:text;color:transparent
}
.subtitle{color:rgba(255,255,255,.42);font-size:1.05rem;letter-spacing:2px;font-weight:300;margin-top:4px}
.instructions-box{
 background:rgba(25,12,14,.55);backdrop-filter:blur(20px);border-radius:16px;
 border:1px solid rgba(231,176,169,.12);padding:22px 28px;margin:10px 0 24px
}
.instructions-title{font-family:Orbitron,monospace;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.35);letter-spacing:2px;margin-bottom:8px}
.instructions-text{font-size:1.15rem;font-weight:600;color:rgba(255,255,255,.72);line-height:1.8}
.highlight{color:var(--venus-light);font-weight:800}
.questions-container{display:flex;flex-direction:column;gap:24px;margin:16px 0 32px}
.question-card{
 background:var(--card);backdrop-filter:blur(30px);border-radius:20px;padding:28px 32px;
 border:1px solid rgba(231,176,169,.11);box-shadow:0 8px 40px rgba(0,0,0,.22)
}
.q-number{font-family:Orbitron,monospace;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.28);letter-spacing:2px;margin-bottom:8px}
.q-text{font-size:1.2rem;font-weight:700;color:rgba(255,255,255,.88);margin-bottom:16px;line-height:1.6}
.options{display:flex;flex-direction:column;gap:10px}
.option{
 display:flex;align-items:center;gap:14px;padding:14px 20px;background:rgba(255,255,255,.025);
 border-radius:12px;border:1px solid rgba(231,176,169,.09);cursor:pointer;transition:.3s
}
.option:hover:not(.disabled){background:var(--venus-soft);border-color:var(--venus-border)}
.option input[type=radio]{
 appearance:none;width:22px;height:22px;border:2px solid rgba(255,255,255,.18);
 border-radius:50%;position:relative;cursor:pointer;flex-shrink:0
}
.option input[type=radio]:checked:not(:disabled){border-color:var(--venus-light);background:rgba(231,176,169,.12)}
.option input[type=radio]:checked:not(:disabled)::after{
 content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
 width:10px;height:10px;border-radius:50%;background:var(--venus-light)
}
.option-label{font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.58)}
.option input[type=radio]:checked:not(:disabled)~.option-label{color:#fff}
.option.correct{background:rgba(74,222,128,.09);border-color:rgba(74,222,128,.24)}
.option.correct .option-label{color:#4ade80!important;font-weight:800}
.option.wrong{background:rgba(255,70,70,.09);border-color:rgba(255,70,70,.24)}
.option.wrong .option-label{color:#ff7777!important;font-weight:800}
.option.disabled{opacity:.68;cursor:default}
.bottom-actions{display:flex;justify-content:center;gap:20px;margin:20px 0 30px;flex-wrap:wrap}
.bottom-actions button{padding:14px 36px;font-size:.9rem;font-weight:700}
.score-display{
 background:rgba(25,12,14,.6);backdrop-filter:blur(20px);border-radius:20px;
 border:1px solid rgba(231,176,169,.12);padding:24px 32px;display:flex;
 justify-content:space-between;align-items:center;margin-top:10px
}
.score-label{font-family:Orbitron,monospace;font-size:.9rem;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:2px}
.score-value{font-family:Orbitron,monospace;font-size:2.2rem;font-weight:900;color:var(--venus-light)}
.denominator{font-size:1.2rem;color:rgba(255,255,255,.25);font-weight:400}
.score-detail{display:flex;align-items:center;gap:30px}
.correct-count{color:#4ade80;font-family:Orbitron,monospace;font-size:1rem;font-weight:700}
.wrong-count{color:#ff7777;font-family:Orbitron,monospace;font-size:1rem;font-weight:700}
@media(max-width:768px){
 body{padding:14px}.top-bar{flex-direction:column;gap:12px;padding:14px 20px}
 .top-actions{flex-wrap:wrap;justify-content:center}.exam-header h1{font-size:2rem}
 .question-card{padding:20px 18px}.q-text{font-size:1rem}.score-display{flex-direction:column;gap:12px;text-align:center}
 .bottom-actions{flex-direction:column;align-items:center}.bottom-actions button{width:100%;max-width:300px}
 .instructions-text{font-size:1rem}.option-label{font-size:.95rem}
}
@media(max-width:480px){.exam-header h1{font-size:1.6rem;letter-spacing:2px}.option{padding:10px 14px}.option-label{font-size:.85rem}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}
::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--venus),var(--venus-light));border-radius:12px}
</style>
</head>
<body>
<div class="cosmic-bg"><div class="nebula nebula-1"></div><div class="nebula nebula-2"></div><div id="starContainer"></div></div>

<div class="container">
<header class="top-bar">
  <div class="brand"><div class="logo-icon">♀</div><span class="glow">AWJ</span></div>
  <div class="top-actions">
    <button class="btn-theme" onclick="toggleTheme()" title="Toggle theme">🌓</button>
    <button class="btn-back" onclick="goBack()">◀ BACK</button>
  </div>
</header>

<div class="exam-header">
  <div class="exam-badge">✦ Vocabulary · VENUS · EXAM 2</div>
  <h1>VOCABULARY</h1>
  <div class="subtitle">G.12 Sem I · 2nd Session 2023-2024</div>
</div>

<div class="instructions-box">
  <div class="instructions-title">📋 INSTRUCTIONS</div>
  <div class="instructions-text">
    For each item, choose the correct word or phrase to complete the sentence.
    <br><br><span class="highlight">⏱️ 5 questions · 5 marks</span>
  </div>
</div>

<div class="questions-container" id="questionsContainer"></div>

<div class="bottom-actions">
  <button class="btn-back" onclick="goBack()">◀ BACK TO DASHBOARD</button>
  <button class="btn-reset" onclick="resetExam()">⟳ RESET ALL</button>
  <button class="btn-submit" id="submitBtn" onclick="submitExam()">✓ SUBMIT EXAM</button>
</div>

<div class="score-display">
  <span class="score-label">✦ SCORE</span>
  <div class="score-detail">
    <span class="correct-count" id="correctCount">✓ 0</span>
    <span class="wrong-count" id="wrongCount">✗ 0</span>
  </div>
  <span class="score-value" id="scoreValue"><span id="scoreNum">0</span><span class="denominator"> / 5</span></span>
</div>
</div>

<script>
function createStars(){
 const c=document.getElementById('starContainer'); if(!c)return;
 for(let i=0;i<100;i++){
  const s=document.createElement('div'); s.className='star';
  const size=Math.random()*3+1;
  s.style.cssText=`width:${size}px;height:${size}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--duration:${Math.random()*4+2}s;--min:${Math.random()*.2+.1};--max:${Math.random()*.6+.4};animation-delay:${Math.random()*4}s`;
  c.appendChild(s);
 }
}
createStars();

let isLightTheme=false;
function toggleTheme(){
 isLightTheme=!isLightTheme;
 document.body.style.background=isLightTheme?'#f4efef':'#160c0d';
 localStorage.setItem('vocabularyTheme',isLightTheme?'light':'dark');
}
if(localStorage.getItem('vocabularyTheme')==='light'){
 isLightTheme=true; document.body.style.background='#f4efef';
}

const questions=[
 {id:1,text:'Ali was so rude that his teacher told him to change his ________.',options:['review','attitude','description','organisation'],correct:1},
 {id:2,text:'To become healthy, everyone should eat ________ meals full of vitamins.',options:['nervous','ambitious','nutritious','cautious'],correct:2},
 {id:3,text:'My father is very proud of all my ________ at university.',options:['discharges','achievements','desires','failures'],correct:1},
 {id:4,text:'We were exhausted because we had spent a whole day ________ the forest.',options:['exploring','fasting','cooking','exchanging'],correct:0},
 {id:5,text:'She has become more relaxed and ________ in her English-speaking skills.',options:['fragrant','hesitant','affluent','confident'],correct:3}
];

let userAnswers={};
let isSubmitted=false;

function renderQuestions(){
 const c=document.getElementById('questionsContainer'); c.innerHTML='';
 questions.forEach((q,index)=>{
  const card=document.createElement('div'); card.className='question-card';
  const letter=String.fromCharCode(65+index);
  card.innerHTML=`
   <div class="q-number">${letter}. Question ${index+1} of 5</div>
   <div class="q-text">${q.text}</div>
   <div class="options" id="options-${index}">
    ${q.options.map((opt,i)=>`
     <label class="option" id="opt-${index}-${i}">
      <input type="radio" name="q${index}" value="${i}" onchange="selectOption(${index},${i})">
      <span class="option-label">${String.fromCharCode(65+i)}. ${opt}</span>
     </label>`).join('')}
   </div>`;
  c.appendChild(card);
 });
}
function selectOption(qIndex,optIndex){
 if(isSubmitted)return;
 userAnswers[qIndex]=optIndex;
 updateSubmitButton();
}
function updateSubmitButton(){
 const b=document.getElementById('submitBtn');
 const answered=Object.keys(userAnswers).length;
 b.disabled=answered<questions.length;
 b.textContent=answered<questions.length?`✓ SUBMIT (${answered}/${questions.length})`:'✓ SUBMIT EXAM';
}
function submitExam(){
 if(isSubmitted)return;
 const answered=Object.keys(userAnswers).length;
 if(answered<questions.length){alert(`Please answer all ${questions.length} questions before submitting. (${answered}/${questions.length} answered)`);return;}
 isSubmitted=true;
 const b=document.getElementById('submitBtn'); b.disabled=true;b.textContent='✓ SUBMITTED';
 let correctCount=0,wrongCount=0;
 questions.forEach((q,index)=>{
  const ans=userAnswers[index],ok=ans===q.correct;
  if(ok)correctCount++;else wrongCount++;
  document.getElementById(`opt-${index}-${q.correct}`).classList.add('correct');
  if(!ok)document.getElementById(`opt-${index}-${ans}`).classList.add('wrong');
  document.querySelectorAll(`#options-${index} .option`).forEach(opt=>{
   opt.classList.add('disabled');
   const r=opt.querySelector('input'); if(r)r.disabled=true;
  });
 });
 document.getElementById('scoreNum').textContent=correctCount;
 document.getElementById('correctCount').textContent=`✓ ${correctCount}`;
 document.getElementById('wrongCount').textContent=`✗ ${wrongCount}`;
 document.getElementById('scoreValue').style.color='#4ade80';

 // Vocabulary-only storage for Venus exam2
 try{
  const student=localStorage.getItem('currentStudent');
  if(student){
   const students=JSON.parse(localStorage.getItem('students'))||{};
   if(!students[student])students[student]={createdAt:new Date().toISOString(),tests:{}};
   if(!students[student].tests)students[student].tests={};
   if(!students[student].tests.exam2)students[student].tests.exam2={};
   students[student].tests.exam2.vocabulary=correctCount;
   localStorage.setItem('students',JSON.stringify(students));
  }
 }catch(e){console.log('Vocabulary score could not be saved.');}
}
function resetExam(){
 if(isSubmitted&&!confirm('This will reset all your answers. Are you sure?'))return;
 isSubmitted=false;userAnswers={};
 document.getElementById('scoreNum').textContent='0';
 document.getElementById('correctCount').textContent='✓ 0';
 document.getElementById('wrongCount').textContent='✗ 0';
 document.getElementById('scoreValue').style.color='var(--venus-light)';
 const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='✓ SUBMIT (0/5)';
 questions.forEach((q,index)=>{
  document.querySelectorAll(`#options-${index} .option`).forEach(opt=>{
   opt.classList.remove('correct','wrong','disabled');
   const r=opt.querySelector('input');if(r){r.checked=false;r.disabled=false;}
  });
 });
}
function goBack(){
 document.body.style.transition='opacity .3s ease';document.body.style.opacity='0';
 setTimeout(()=>{window.location.href='venus_Dashboard.html'},300);
}
renderQuestions();updateSubmitButton();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.getElementById('submitBtn').disabled)submitExam();});
</script>
</body>
</html>
