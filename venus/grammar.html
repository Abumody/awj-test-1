<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grammar 02 · Venus Exam</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--venus:#C47A6D;--venus-dark:#8F4F48;--venus-light:#E6B0A6;--bg:#160b0c}
body{font-family:'Inter','Segoe UI',sans-serif;color:#fff;min-height:100vh;padding:20px 28px 50px;background:var(--bg);position:relative;transition:.4s}
body.light-theme{background:#f5eeee;color:#2b1717}
.cosmic-bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:
radial-gradient(ellipse at 20% 30%,#3b1718,transparent 60%),
radial-gradient(ellipse at 80% 70%,#2a1011,transparent 50%),
radial-gradient(ellipse at 50% 50%,#160b0c,#080303 100%);transition:.4s}
.nebula{position:absolute;border-radius:50%;filter:blur(120px);pointer-events:none;animation:float 32s ease-in-out infinite alternate}
.nebula-1{width:600px;height:600px;background:rgba(196,122,109,.10);top:-200px;right:-100px}
.nebula-2{width:500px;height:500px;background:rgba(143,79,72,.09);bottom:-150px;left:-100px;animation-duration:40s}
@keyframes float{0%{transform:translate(0,0) scale(1)}33%{transform:translate(60px,-40px) scale(1.1)}66%{transform:translate(-40px,60px) scale(.9)}100%{transform:translate(40px,-30px) scale(1.05)}}
.star{position:absolute;border-radius:50%;pointer-events:none;background:#fff;animation:twinkle var(--duration) ease-in-out infinite alternate}
@keyframes twinkle{0%,100%{opacity:var(--min-opacity)}50%{opacity:var(--max-opacity);transform:scale(1.3)}}
.container{max-width:950px;margin:auto;position:relative;z-index:5}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:14px 32px;background:rgba(28,12,12,.65);backdrop-filter:blur(30px);border-radius:60px;border:1px solid rgba(196,122,109,.12);box-shadow:0 8px 40px rgba(0,0,0,.5);margin-bottom:30px}
.brand{font-family:'Orbitron',monospace;font-size:24px;font-weight:900;letter-spacing:2px;display:flex;align-items:center;gap:12px}
.logo-icon{width:40px;height:40px;border:2px solid rgba(196,122,109,.35);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;background:rgba(196,122,109,.08);color:var(--venus)}
.glow{background:linear-gradient(135deg,var(--venus-light),var(--venus));-webkit-background-clip:text;background-clip:text;color:transparent}
.top-actions{display:flex;align-items:center;gap:12px}
button{font-family:'Orbitron',monospace;font-weight:700;letter-spacing:1px;cursor:pointer;transition:.3s;border-radius:40px}
.btn-theme,.btn-back,.btn-reset,.btn-submit{padding:10px 22px;border:1px solid rgba(196,122,109,.14)}
.btn-theme{background:rgba(255,255,255,.03);color:rgba(255,255,255,.6);font-size:1.2rem;padding:8px 14px}
.btn-back{background:rgba(255,255,255,.03);color:rgba(255,255,255,.7)}
.btn-reset{background:rgba(220,170,80,.04);color:#ffcc66}
.btn-submit{background:linear-gradient(135deg,rgba(196,122,109,.16),rgba(143,79,72,.16));color:var(--venus-light)}
.btn-theme:hover,.btn-back:hover,.btn-reset:hover,.btn-submit:hover:not(:disabled){transform:scale(1.04);border-color:rgba(196,122,109,.35)}
.btn-submit:disabled{opacity:.3;cursor:not-allowed}
.exam-header{text-align:center;padding:24px 0 20px}
.exam-badge{font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;letter-spacing:3px;color:rgba(255,255,255,.35);padding:8px 28px;border:1px solid rgba(196,122,109,.12);border-radius:40px;display:inline-block;margin-bottom:10px}
.exam-header h1{font-family:'Orbitron',monospace;font-size:3rem;font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,#fff,var(--venus-light));-webkit-background-clip:text;background-clip:text;color:transparent}
.subtitle{color:rgba(255,255,255,.35);font-size:1.1rem;letter-spacing:2px;margin-top:4px}
.instructions-box,.question-card,.score-display{background:rgba(28,12,12,.38);backdrop-filter:blur(30px);border:1px solid rgba(196,122,109,.10);box-shadow:0 8px 40px rgba(0,0,0,.2);transition:.4s}
.instructions-box{border-radius:16px;padding:22px 28px;margin:10px 0 24px}
.instructions-title,.score-label{font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.3);letter-spacing:2px;margin-bottom:8px}
.instructions-text{font-size:1.2rem;font-weight:600;color:rgba(255,255,255,.72);line-height:1.8}
.questions-container{display:flex;flex-direction:column;gap:24px;margin:16px 0 32px}
.question-card{border-radius:20px;padding:28px 32px}
.q-number{font-family:'Orbitron',monospace;font-size:.8rem;font-weight:700;color:rgba(255,255,255,.22);letter-spacing:2px;margin-bottom:8px}
.q-text{font-size:1.2rem;font-weight:700;color:rgba(255,255,255,.88);margin-bottom:16px;line-height:1.7}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;align-items:center;gap:14px;padding:14px 20px;background:rgba(255,255,255,.025);border-radius:12px;border:1px solid rgba(255,255,255,.05);cursor:pointer;transition:.3s}
.option:hover:not(.disabled){background:rgba(196,122,109,.06);border-color:rgba(196,122,109,.22)}
.option input[type=radio]{appearance:none;width:22px;height:22px;border:2px solid rgba(255,255,255,.15);border-radius:50%;position:relative;cursor:pointer;flex-shrink:0}
.option input[type=radio]:checked:not(:disabled){border-color:var(--venus);background:rgba(196,122,109,.12)}
.option input[type=radio]:checked:not(:disabled)::after{content:'';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--venus)}
.option-label{font-size:1.1rem;font-weight:600;color:rgba(255,255,255,.58)}
.option input[type=radio]:checked:not(:disabled)~.option-label{color:#fff}
.option.correct{background:rgba(74,222,128,.08);border-color:rgba(74,222,128,.22)}
.option.correct .option-label{color:#4ade80!important;font-weight:800}
.option.correct input[type=radio]{border-color:#4ade80!important;background:rgba(74,222,128,.1)!important}
.option.correct input[type=radio]::after{background:#4ade80!important}
.option.wrong{background:rgba(255,50,50,.08);border-color:rgba(255,50,50,.22)}
.option.wrong .option-label{color:#ff6b6b!important;font-weight:800}
.option.wrong input[type=radio]{border-color:#ff6b6b!important;background:rgba(255,50,50,.1)!important}
.option.wrong input[type=radio]::after{background:#ff6b6b!important}
.option.disabled{opacity:.62;cursor:default}
.bottom-actions{display:flex;justify-content:center;gap:20px;margin:20px 0 30px;flex-wrap:wrap}
.bottom-actions button{padding:14px 36px;font-size:.9rem}
.score-display{border-radius:20px;padding:24px 32px;display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.score-value{font-family:'Orbitron',monospace;font-size:2.2rem;font-weight:900;color:var(--venus)}
.denominator{font-size:1.2rem;color:rgba(255,255,255,.2);font-weight:400}
.score-detail{display:flex;align-items:center;gap:30px}
.correct-count{color:#4ade80;font-family:'Orbitron',monospace;font-weight:700}
.wrong-count{color:#ff6b6b;font-family:'Orbitron',monospace;font-weight:700}
body.light-theme .cosmic-bg{background:radial-gradient(ellipse at 20% 30%,#f0deda,transparent 60%),radial-gradient(ellipse at 80% 70%,#ead1cd,transparent 50%),#f5eeee}
body.light-theme .nebula{display:none}
body.light-theme .top-bar,body.light-theme .instructions-box,body.light-theme .question-card,body.light-theme .score-display{background:rgba(255,255,255,.72);border-color:rgba(120,60,55,.10);box-shadow:0 8px 40px rgba(60,20,20,.05)}
body.light-theme .brand .glow{background:linear-gradient(135deg,#B45F55,#8F4F48);-webkit-background-clip:text;background-clip:text;color:transparent}
body.light-theme .logo-icon{color:#A95D54;border-color:rgba(169,93,84,.22);background:rgba(169,93,84,.05)}
body.light-theme .exam-header h1{background:linear-gradient(135deg,#2b1717,#8F4F48);-webkit-background-clip:text;background-clip:text;color:transparent}
body.light-theme .subtitle,body.light-theme .q-number,body.light-theme .instructions-title,body.light-theme .score-label{color:rgba(43,23,23,.35)}
body.light-theme .instructions-text,body.light-theme .q-text{color:rgba(43,23,23,.78)}
body.light-theme .option{background:rgba(80,30,30,.025);border-color:rgba(80,30,30,.06)}
body.light-theme .option-label{color:rgba(43,23,23,.58)}
body.light-theme .option input[type=radio]{border-color:rgba(43,23,23,.18)}
body.light-theme .option input[type=radio]:checked:not(:disabled){border-color:#A95D54;background:rgba(169,93,84,.08)}
body.light-theme .option input[type=radio]:checked:not(:disabled)::after{background:#A95D54}
body.light-theme .option input[type=radio]:checked:not(:disabled)~.option-label{color:#2b1717}
body.light-theme .btn-back,body.light-theme .btn-theme{color:rgba(43,23,23,.65);background:rgba(43,23,23,.025)}
@media(max-width:768px){body{padding:14px}.top-bar{flex-direction:column;gap:12px;padding:14px 20px}.top-actions{flex-wrap:wrap;justify-content:center}.exam-header h1{font-size:2rem}.question-card{padding:20px 18px}.q-text{font-size:1rem}.score-display{flex-direction:column;gap:12px;text-align:center}.bottom-actions{flex-direction:column;align-items:center}.bottom-actions button{width:100%;max-width:300px}.instructions-text{font-size:1rem}.option-label{font-size:.95rem}}
@media(max-width:480px){.exam-header h1{font-size:1.6rem;letter-spacing:2px}.option{padding:10px 14px}.option-label{font-size:.85rem}}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-track{background:rgba(0,0,0,.3)}::-webkit-scrollbar-thumb{background:linear-gradient(135deg,var(--venus),var(--venus-dark));border-radius:12px}
</style>
</head>
<body>
<div class="cosmic-bg"><div class="nebula nebula-1"></div><div class="nebula nebula-2"></div><div id="starContainer"></div></div>
<div class="container">
<header class="top-bar">
<div class="brand"><div class="logo-icon">♀</div><span class="glow">AWJ</span></div>
<div class="top-actions"><button class="btn-theme" onclick="toggleTheme()">🌓</button><button class="btn-back" onclick="goBack()">◀ BACK</button></div>
</header>
<div class="exam-header">
<div class="exam-badge">✦ GRAMMAR 02 · VENUS</div>
<h1>GRAMMAR FOCUS</h1>
<div class="subtitle">♀ G.12 Sem I 2nd Session 2023-2024</div>
</div>
<div class="instructions-box">
<div class="instructions-title">📋 INSTRUCTIONS</div>
<div class="instructions-text">For each item, shade in the bubble next to the correct option.<br><br><span style="font-size:.9rem;font-weight:400;opacity:.5">⏱️ Read the conversation carefully and select the best answer.</span></div>
</div>
<div class="questions-container" id="questionsContainer"></div>
<div class="bottom-actions">
<button class="btn-back" onclick="goBack()">◀ BACK TO DASHBOARD</button>
<button class="btn-reset" onclick="resetExam()">⟳ RESET ALL</button>
<button class="btn-submit" id="submitBtn" onclick="submitExam()">✓ SUBMIT EXAM</button>
</div>
<div class="score-display">
<span class="score-label">✦ SCORE</span>
<div class="score-detail"><span class="correct-count" id="correctCount">✓ 0</span><span class="wrong-count" id="wrongCount">✗ 0</span></div>
<span class="score-value" id="scoreValue"><span id="scoreNum">0</span><span class="denominator"> / 5</span></span>
</div>
</div>
<script>
function createStars(){const c=document.getElementById('starContainer');for(let i=0;i<120;i++){const s=document.createElement('div');s.className='star';const z=Math.random()*3+1;s.style.cssText=`width:${z}px;height:${z}px;left:${Math.random()*100}%;top:${Math.random()*100}%;--duration:${Math.random()*4+2}s;--min-opacity:${Math.random()*.2+.1};--max-opacity:${Math.random()*.6+.4};animation-delay:${Math.random()*4}s`;c.appendChild(s)}}createStars();
let isLightTheme=localStorage.getItem('grammar02Theme')==='light';document.body.classList.toggle('light-theme',isLightTheme);
function toggleTheme(){isLightTheme=!isLightTheme;document.body.classList.toggle('light-theme',isLightTheme);localStorage.setItem('grammar02Theme',isLightTheme?'light':'dark')}
const questions=[
{id:1,text:'Speaker A: Hi! How was your trip to Australia last year?<br><br>Speaker B: Oh, it was horrible! I (1) ______ a terrible experience there.',options:['has had','had'],correct:1},
{id:2,text:'Speaker A: Really! What happened?<br><br>Speaker B: Well, we were swimming, when suddenly I (2) ______ by a shark.',options:['was attacked','were attacked'],correct:0},
{id:3,text:'Speaker A: Oh dear! So what did you (3) ______?',options:['doing','do'],correct:1},
{id:4,text:'Speaker B: Well, I screamed and screamed. Thankfully, my friends saved me but I had (4) ______ stay in hospital in Australia for six months.',options:['to','for'],correct:0},
{id:5,text:'Speaker A: Oh! I’m so sorry! I had no idea but I can see that you (5) ______ fine now.',options:['are','were'],correct:0}
];
let userAnswers={},isSubmitted=false;
function renderQuestions(){const c=document.getElementById('questionsContainer');c.innerHTML='';questions.forEach((q,i)=>{const card=document.createElement('div');card.className='question-card';card.innerHTML=`<div class="q-number">${String.fromCharCode(65+i)}. Question ${i+1} of 5</div><div class="q-text">${q.text}</div><div class="options" id="options-${i}">${q.options.map((o,j)=>`<label class="option" id="opt-${i}-${j}"><input type="radio" name="q${i}" value="${j}" onchange="selectOption(${i},${j})"><span class="option-label">${String.fromCharCode(65+j)}. ${o}</span></label>`).join('')}</div>`;c.appendChild(card)})}
function selectOption(i,j){if(isSubmitted)return;userAnswers[i]=j;updateSubmitButton()}
function updateSubmitButton(){const b=document.getElementById('submitBtn'),n=Object.keys(userAnswers).length;b.disabled=n<questions.length;b.textContent=n<questions.length?`✓ SUBMIT (${n}/${questions.length})`:'✓ SUBMIT EXAM'}
function submitExam(){if(isSubmitted)return;const n=Object.keys(userAnswers).length;if(n<questions.length){alert(`Please answer all ${questions.length} questions before submitting. (${n}/${questions.length} answered)`);return}isSubmitted=true;const b=document.getElementById('submitBtn');b.disabled=true;b.textContent='✓ SUBMITTED';let correct=0;questions.forEach((q,i)=>{const ua=userAnswers[i],ok=ua===q.correct;if(ok)correct++;document.getElementById(`opt-${i}-${q.correct}`).classList.add('correct');if(!ok)document.getElementById(`opt-${i}-${ua}`).classList.add('wrong');document.querySelectorAll(`#options-${i} .option`).forEach(o=>{o.classList.add('disabled');o.querySelector('input').disabled=true})});document.getElementById('scoreNum').textContent=correct;document.getElementById('correctCount').textContent=`✓ ${correct}`;document.getElementById('wrongCount').textContent=`✗ ${questions.length-correct}`;document.getElementById('scoreValue').style.color='#4ade80';try{const student=localStorage.getItem('currentStudent');if(student){const students=JSON.parse(localStorage.getItem('students'))||{};if(!students[student])students[student]={createdAt:new Date().toISOString(),tests:{}};if(!students[student].tests)students[student].tests={};if(!students[student].tests.exam2)students[student].tests.exam2={};students[student].tests.exam2.grammar=correct;localStorage.setItem('students',JSON.stringify(students))}}catch(e){}}
function resetExam(){if(isSubmitted&&!confirm('Reset all answers?'))return;isSubmitted=false;userAnswers={};document.getElementById('scoreNum').textContent='0';document.getElementById('correctCount').textContent='✓ 0';document.getElementById('wrongCount').textContent='✗ 0';document.getElementById('scoreValue').style.color='var(--venus)';questions.forEach((q,i)=>document.querySelectorAll(`#options-${i} .option`).forEach(o=>{o.classList.remove('correct','wrong','disabled');const r=o.querySelector('input');r.checked=false;r.disabled=false}));updateSubmitButton()}
function goBack(){document.body.style.opacity='0';document.body.style.transition='opacity .3s ease';setTimeout(()=>location.href='venus_Dashboard.html',300)}
renderQuestions();updateSubmitButton();
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&!document.getElementById('submitBtn').disabled)submitExam()});
</script>
</body>
</html>
